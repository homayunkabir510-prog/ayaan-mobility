name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ayaan_mobility
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ayaan_mobility"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ayaan_mobility?schema=public
      SESSION_SECRET: ci-only-secret-that-is-not-valid-for-production-123456789
      DATABASE_POOL_MAX: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate core environment
        run: npm run env:check

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npm run db:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Verify migration status
        run: npm run db:status

      - name: Build production application
        run: npm run build

      - name: Smoke-test production server
        run: npm run ci:smoke

      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
